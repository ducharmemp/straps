name: trynix

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: straps
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build Neovim with the plugins installed
        run: nix build .#trynix --print-build-logs
      - name: Push the closure to cachix
        run: cachix push straps ./result
      - uses: fzakaria/trynix@v1
        with:
          cache: https://straps.cachix.org
          publicKey: straps.cachix.org-1:gIDDdJpG0PoYChaUlVaqtDq7RAk3QekG1AqSPiN3ObI=
          attrs: .#trynix
          verify: fail
          commit: ${{ github.event.pull_request.head.sha }}
